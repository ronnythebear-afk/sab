# When drop.txt or the drop folder changes, this turns what's there into cards on the site
# (tools/drop.mjs for links and words, tools/pics.py for pictures) and saves the result here.
name: Add new things
on:
  push:
    branches: [main]
    paths: ['drop.txt', 'drop/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add
  cancel-in-progress: false
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - run: node tools/drop.mjs
      - run: python3 tools/pics.py
      - name: Save what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add new things"
            git push
          fi
