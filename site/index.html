<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summer Anne Burton</title>
<meta name="description" content="Summer Anne Burton is a creative director in Austin, Texas.">
<meta name="theme-color" content="#e0218a">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="Summer Anne Burton">
<meta property="og:description" content="Creative director, Austin.">
<meta property="og:image" content="https://summeranneburton.com/media/og.png">
<meta property="og:url" content="https://summeranneburton.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main>
  <!-- The front page is a photo booth. Move across it and the hair changes. -->
  <section class="home" id="home" aria-label="Summer Anne Burton">
    <div class="booth">
      <button class="stage" id="stage" aria-label="Photo booth. Move across the page to flip through photos. Click to take a picture.">
        <img id="frame" alt="">
        <span class="count" id="count" aria-hidden="true"></span>
        <span class="shots" id="shots" aria-hidden="true"></span>
      </button>
    </div>
    <div class="side">
      <h1 class="nm" id="nm">Summer Anne Burton</h1>
      <p class="role" id="role"></p>
      <nav class="reels" id="reels" aria-label="Sections"></nav>
      <p class="contact" id="contact"></p>
    </div>
  </section>

  <aside class="strip" id="strip" hidden aria-label="Your photo booth strip"></aside>

  <!-- Each frame on the front page opens one of these. -->
  <div class="rooms" id="rooms">
    <section class="room" id="work" data-name="Work">
      <div id="work-box"></div>
    </section>
    <section class="room" id="drawings" data-name="Drawings">
      <p class="room-words" id="hof-intro"></p>
      <div class="wall" id="hof"></div>
      <div class="wall small" id="sketchbook"></div>
    </section>
    <section class="room" id="clippings" data-name="Writing">
      <div class="clip-filters" id="clip-filters" role="toolbar" aria-label="Show writing from"></div>
      <div class="clips" id="clips"></div>
      <div class="press"><h2 class="sub-h">Press</h2><ul id="press"></ul></div>
    </section>
    <section class="room" id="playlists" data-name="Playlists">
      <div id="covers"></div>
    </section>
    <section class="room" id="cv" data-name="CV">
      <div class="card-wrap" id="bbcard"></div>
    </section>
  </div>
</main>

<dialog class="sheet-d" id="sheet" aria-label="A piece of work"></dialog>
<dialog class="lightbox" id="lightbox" aria-label="A closer look"></dialog>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="content/content.js"></script>
<script src="content/faces.js"></script>
<script src="content/playlists.js"></script>
<script src="content/clips/index.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
