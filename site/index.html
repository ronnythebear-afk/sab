<body class="table">
<!--
  A card table. Everything is a card in one of four decks: Work, Images, Words and Baseball
  drawings, newest on top. Tap a deck to deal its next card. Cards can be moved and flicked
  around, and tapping one opens it. Pull a reading lays out five cards face down. Radio
  shuffles a Spotify playlist.
-->
<header class="top">
  <button class="me" id="me" type="button" aria-label="Photo booth: take a new picture"><img id="me-img" alt="" src=""></button>
  <div class="who">
    <h1 class="name" id="name"></h1>
    <p class="role" id="role"></p>
  </div>
  <nav class="hud" aria-label="Get in touch">
    <span class="avail" id="avail" hidden></span><button class="radio" id="radio" type="button" aria-pressed="false" hidden><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i>Radio</button><a href="#cv" id="cv-link">CV</a><a id="mail" class="mail">Email</a>
  </nav>
</header>
<div class="player" id="player" hidden><div id="spot"></div><button class="shuffle" id="shuffle" type="button">Shuffle</button></div>

<main class="cards" id="cards" aria-label="Cards on the table"></main>

<div class="dock">
  <button class="reading" id="reading" type="button">Pull a reading</button>
  <nav class="decks" id="decks" aria-label="Decks"></nav>
</div>

<dialog class="big" id="big" aria-label="A card, up close"></dialog>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="content/content.js"></script>
<script src="content/feed.js"></script>
<script src="content/faces.js"></script>
<script src="content/radio.js"></script>
<script src="assets/deck.js"></script>
</body>
</html>
