<body class="table">
<!--
  A card table on a cutting mat. Everything is a card in one of five decks along the bottom:
  Work, Posts, Words, Art and Music, newest on top. Tap a deck to deal its next card. Cards
  can be moved and flicked around the mat, and tapping one opens it.
-->
<div class="mat" id="mat" aria-hidden="true"><div class="ruler top" id="ruler-top"></div><div class="ruler left" id="ruler-left"></div><i class="angle"></i></div>

<header class="mast">
  <button class="strip" id="strip" type="button" aria-label="Photo booth: take new pictures"></button>
  <div class="mast-words">
    <h1 class="name" id="name"></h1>
    <p class="role" id="role"></p>
  </div>
</header>

<nav class="hud" aria-label="Get in touch">
  <span class="avail" id="avail" hidden></span><a href="#cv" id="cv-link">CV</a><a id="mail" class="mail">Email</a>
</nav>

<main class="cards" id="cards" aria-label="Cards on the table"></main>

<nav class="decks" id="decks" aria-label="Decks"></nav>

<dialog class="big" id="big" aria-label="A card, up close"></dialog>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="content/content.js"></script>
<script src="content/feed.js"></script>
<script src="content/faces.js"></script>
<script src="assets/deck.js"></script>
</body>
</html>
